name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm install
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm install
      - run: npx prisma generate
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL: 'postgresql://user:password@localhost:5432/eventhub_ci'
      JWT_ACCESS_SECRET: 'ci_test_access_secret_at_least_32_characters_long'
      JWT_REFRESH_SECRET: 'ci_test_refresh_secret_at_least_32_characters_long_x'
      REDIS_URL: 'redis://localhost:6379'
      RABBITMQ_URL: 'amqp://localhost'
      GMAIL_USER: 'ci-test@example.com'
      GMAIL_APP_PASSWORD: 'dummy_app_password'
      CLOUDINARY_CLOUD_NAME: 'dummy_cloud'
      CLOUDINARY_API_KEY: 'dummy_key'
      CLOUDINARY_API_SECRET: 'dummy_secret'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm install
      - run: npx prisma generate
      - run: npm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm install
      - run: npx prisma generate
      - run: npm run build

  deploy:
    needs: [lint, typecheck, test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - run: curl -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
